name: DAST Scan - OWASP ZAP

on:
  # Lanzar el escaneo a mano desde la pestaña "Actions"
  workflow_dispatch:

  # Ejecuta automáticamente cada lunes a las 00:00 UTC
  schedule:
    - cron: '0 0 * * 1'

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'https://practica3-devsecops-d4t3.onrender.com'
          fail_action: false