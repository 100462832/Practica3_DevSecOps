name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  security-checks:
    name: SAST and SCA Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar herramientas de seguridad
        run: |
          pip install semgrep pip-audit

      - name: Análisis SAST con Semgrep
        continue-on-error: true
        run: |
          echo "Ejecutando análisis SAST con Semgrep..."
          semgrep scan --config auto --error

      - name: Análisis SCA con pip-audit
        run: |
          echo "Ejecutando análisis SCA con pip-audit..."
          pip-audit -r requirements.txt

      - name: Resultado final
        run: |
          echo "Pipeline DevSecOps finalizado"